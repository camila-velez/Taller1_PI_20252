{% extends "base.html" %}
{% block content %}   

<div class="container my-4">

    <!-- Buscador -->
    <form action="" class="mb-4">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">Search Movie</label>
            <input type="text" class="form-control" name="searchMovie" placeholder="Search Movie">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <p>Search results for: <strong>{{searchTerm}}</strong></p>

    <!-- Grid de películas -->
    <div class="row row-cols-1 row-cols-md-4 g-4">
        {% for movie in movies %}
        <div class="col">
            <div class="card h-100 shadow-sm movie-card">
                <img src="{{movie.image.url}}" alt="{{movie.title}}" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">{{movie.title}}</h5>
                    <p class="card-text">{{movie.description}}</p>
                    <p class="card-text">
                        <small class="text-muted">{{movie.genre}} - {{movie.year}}</small>
                    </p>
                    {% if movie.url %}
                        <a href="{{movie.url}}" class="btn btn-secondary">Movie Link</a>
                    {% endif %}
                </div>
            </div>  
        </div>
        {% endfor %}
    </div>

    <!-- Newsletter -->
    <h2 class="mt-5">Join our newsletter</h2>
    <form action="{% url 'signup' %}">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" placeholder="">
        </div>
        <button type="submit" class="btn btn-success">Sign Up</button>
    </form>

</div>

<!-- Estilos de hover -->
<style>
    .movie-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .movie-card:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
</style>

{% endblock content %}
