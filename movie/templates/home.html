{% extends "base.html" %}
{% block content %}   
<class ="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search Movie
            </label>
            <input type="text" class="form-control" name="searchMovie" placeholder="Search Movie">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Search results for: <strong>{{seatchTerm}}</strong></p>
    <class="row row-cols-1 row-cols-md-3 g-4">
        {%for movie in movies%}
        <div v-for="movie in movies" class="col">
            <div class="card" style="width: 18rem;">
            <img src="{{movie.image.url}}" alt="{{movie.title}}" class="card-img-top">
            <div class="card-body">
                <h5 class="card-title">{{movie.title}}</h5>
                <p class="card-text">{{movie.description}}</p>
                <p class="card-text"><small class="text-muted">{{movie.genre}} - {{movie.year}}</small></p>
                {% if movie.url %}
                    <a href="{{movie.url}}" class="btn btn-secondary">Movie Link</a>
                {% endif %}
            </div>
            </div>  
        </div>
        {% endfor %}
    </div>
    <h2>Join our newsletter</h2>
    <form action="{% url 'signup' %}">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" placeholder="">
</div>

{% endblock content %}
